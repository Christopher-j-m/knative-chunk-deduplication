# Dragonfly settings
client:
  config:
    proxy:
      registryMirror:
        addr: https://__ACR__ # acr that contains all dummy images for the benchmarks
# Manages the schedulers
manager:
  replicas: 1
# Decides from which other node a chunk should be fetched from (or as fallback remote registry)
scheduler:
  replicas: 1
  config:
    # Disable seedpeer because it cant login to azure => causes 401 and therefore useless
    seedPeer:
      enable: false
    scheduler:
      retryBackToSourceLimit: 1
      retryInterval: 500ms
seedClient:
  enable: false
