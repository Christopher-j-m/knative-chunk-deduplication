# Dragonfly on the local rig, with the settings of the AKS experiments
# so the two deployments differ only in where the registry is
client:
  config:
    proxy:
      registryMirror:
        addr: __REGISTRY__
# Manages the schedulers
manager:
  replicas: 1
# Decides from which other node a piece is fetched, with the registry as fallback
scheduler:
  replicas: 1
  config:
    seedPeer:
      enable: false
    scheduler:
      retryBackToSourceLimit: 1
      retryInterval: 500ms
seedClient:
  enable: false
