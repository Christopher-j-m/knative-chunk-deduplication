# Local kubernetes cluster for local benchmarking (e.g. measuring cold start latency of the dummy images) that doesnt need a AKS
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: nydus-cache
servers: 1 # Control node
agents: __AGENTS__ # Amount of workers/node 
registries:
  # Create image registry
  create:
    name: registry.localhost
    host: "0.0.0.0"
    hostPort: "5000"
options:
  k3s:
    # Mark worker nodes for pod placement
    nodeLabels:
      - label: nydus-cache/role=worker
        nodeFilters:
          - agent:*
volumes:
  # Register nydus snapshotter as containerd proxy
  - volume: __PWD__/deploy/local/containerd-config.toml.tmpl:/var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl
    nodeFilters:
      - server:*
      - agent:*
