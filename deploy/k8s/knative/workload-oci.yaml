# Test image for oci
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fn-python-hello
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
    spec:
      containers:
        - image: registry.localhost:5000/fn-python-hello:oci
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080
