# The cluster cache chunk proxy pod on every node 
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: chunk-proxy
  namespace: kube-system
  labels:
    app: chunk-proxy
spec:
  selector:
    matchLabels:
      app: chunk-proxy
  template:
    metadata:
      labels:
        app: chunk-proxy
    spec:
      hostNetwork: true
      containers:
        - name: chunk-proxy
          image: registry.localhost:5000/chunk-proxy:0.1.0
          imagePullPolicy: Always
          args:
            - "--listen=127.0.0.1:18000"
            - "--cache-enabled=true"
            - "--cache-endpoint=http://10.43.0.50:8080"
            - "--registry=http://registry.localhost:5000"
            - "--bootstrap-dir=/var/lib/rancher/k3s/agent/containerd-nydus/snapshots"
          securityContext:
            privileged: true
          volumeMounts:
            - { name: nydus-lib, mountPath: /var/lib/rancher/k3s/agent/containerd-nydus }
      volumes:
        - name: nydus-lib
          hostPath: { path: /var/lib/rancher/k3s/agent/containerd-nydus, type: DirectoryOrCreate }
