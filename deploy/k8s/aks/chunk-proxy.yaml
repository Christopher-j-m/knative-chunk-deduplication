# Cluster cache chunk proxy daemon that runs on each cluster node
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: chunk-proxy
  namespace: kube-system
  labels:
    app: chunk-proxy
spec:
  selector:
    matchLabels:
      app: chunk-proxy
  template:
    metadata:
      labels:
        app: chunk-proxy
    spec:
      hostNetwork: true
      containers:
        - name: chunk-proxy
          image: __ACR__/chunk-proxy:0.2.1
          imagePullPolicy: Always
          args:
            - "--listen=127.0.0.1:18000"
            - "--cache-enabled=true"
            - "--cache-endpoint=http://10.0.0.50:8080"
            - "--registry=https://__ACR__"
            - "--bootstrap-dir=/var/lib/containerd-nydus/snapshots"
            # Set it high enough to not pollute results by skipping the cluster cache if theres a brief downtime => most likely due to a reset that would send the whole run to the remote cache instead
            - "--breaker-threshold=1000000"
            - "--cache-timeout=500ms"
          readinessProbe:
            tcpSocket: { host: 127.0.0.1, port: 18000 }
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            tcpSocket: { host: 127.0.0.1, port: 18000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            privileged: true
          volumeMounts:
            - { name: nydus-lib, mountPath: /var/lib/containerd-nydus }
      volumes:
        - name: nydus-lib
          hostPath: { path: /var/lib/containerd-nydus, type: DirectoryOrCreate }
