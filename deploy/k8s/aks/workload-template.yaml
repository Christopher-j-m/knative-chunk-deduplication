# Template for every image that we use during the runs 
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: __NAME__
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/initial-scale: "__INITIAL_SCALE__"
    spec:
      containers:
        - image: __ACR__/__SERVICE__:__TAG__
          ports:
            - containerPort: __PORT__
          # Check every seconds if the node can accept new connections so the measurements are correct
          readinessProbe:
            tcpSocket:
              port: __PORT__
            periodSeconds: 1
            failureThreshold: 30
