# Knative workload for one corpus function on AKS. Rendered by
# scripts/render-workload.sh: the registry, function name, image variant
# tag, and listen port are substituted per benchmark cell, so one template
# serves every configuration and every corpus image. The image runs its
# own entrypoint; the cache vs no-cache difference is the chunk-proxy
# --cache-enabled toggle, not this manifest
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: __SERVICE__
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
    spec:
      containers:
        - image: __ACR__/__SERVICE__:__TAG__
          ports:
            - containerPort: __PORT__
